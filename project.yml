name: Kinward
options:
  bundleIdPrefix: com.ali
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Signing is off for the simulator only, so headless simulator builds need no
    # certificate. Device builds sign normally with the settings on the target.
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
targets:
  Kinward:
    type: application
    platform: iOS
    sources:
      - path: Kinward
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        # Automatic signing so the app installs on a real iPhone.
        # DEVELOPMENT_TEAM is ali tavakolbakhoda's personal Apple ID team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PLBCH3VD36
        CODE_SIGN_IDENTITY: "Apple Development"
        PRODUCT_BUNDLE_IDENTIFIER: com.ali.Kinward
        INFOPLIST_KEY_CFBundleDisplayName: Kinward
        PRODUCT_NAME: Kinward
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kinward records your voice so the people you love can hear you, not just read you."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kinward keeps the photographs that belong to your memories and letters."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kinward lets you photograph documents and belongings you want to pass on."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kinward uses Face ID to protect your private documents and guidance."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
