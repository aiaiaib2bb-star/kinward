name: Kinward
options:
  bundleIdPrefix: com.ali
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Signing is off for the simulator only, so headless simulator builds need no
    # certificate. Device builds sign normally with the settings on the target.
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.89.0"

targets:
  Kinward:
    type: application
    platform: iOS
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    sources:
      - path: Kinward
    preBuildScripts:
      # An App Store build without the RevenueCat key installs and runs, but can't
      # sell Kinward Plus — and nothing would say so until reviewers tried to buy.
      # Archiving is where that gets caught.
      - name: Check the RevenueCat key before archiving
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" = "install" ]; then
            KEY=$(/usr/libexec/PlistBuddy -c "Print :PublicSDKKey" "$SRCROOT/Kinward/Resources/RevenueCat.plist" 2>/dev/null | tr -d '[:space:]')
            if [ -z "$KEY" ]; then
              echo "error: Kinward/Resources/RevenueCat.plist has no PublicSDKKey. Paste the public Apple SDK key (appl_…) from RevenueCat before archiving."
              exit 1
            fi
          fi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        # Automatic signing so the app installs on a real iPhone.
        # DEVELOPMENT_TEAM is ali tavakolbakhoda's personal Apple ID team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PLBCH3VD36
        CODE_SIGN_IDENTITY: "Apple Development"
        PRODUCT_BUNDLE_IDENTIFIER: com.ali.Kinward
        INFOPLIST_KEY_CFBundleDisplayName: Kinward
        PRODUCT_NAME: Kinward
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kinward records your voice so the people you love can hear you, not just read you."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kinward keeps the photographs that belong to your memories and letters."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kinward lets you photograph documents and belongings you want to pass on."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kinward uses Face ID to protect your private documents and guidance."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons the user picks in Settings. Listing them here lets
        # Xcode write the CFBundleAlternateIcons entries itself, which matters
        # because the Info.plist is generated rather than checked in.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: House Hands Window Bust Seal Hourglass Compass Arch
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
    # Kept outside Kinward/ so it is never swept up as a bundle resource. The
    # INFOPLIST_KEY_* settings above are still merged into it at build time.
    info:
      path: Kinward-Info.plist
      properties:
        # The parcel one Kinward writes and another opens. Declaring it means a
        # .kinward file arriving by Mail, Messages or AirDrop offers Kinward.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ali.Kinward.heirloom
            UTTypeDescription: Kinward parcel
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [kinward]
        # Kinward reads a parcel and copies what is inside into its own archive; it
        # never edits the file you were sent, so it does not open one in place.
        LSSupportsOpeningDocumentsInPlace: false
        # Kinward's only encryption is the HTTPS the system does for RevenueCat,
        # which is exempt. Saying so here skips the export-compliance question on
        # every upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kinward parcel
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.ali.Kinward.heirloom]
